services:
  web:
    build: .
    container_name: my_todo_app
    restart: always
    ports:
      - "7777:7777"
  prometheus:
    image: mirror.gcr.io/prom/prometheus:latest
    container_name: my_prometheus
    volumes:
     - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
     - "9090:9090"
  node-exporter:
    image: mirror.gcr.io/prom/node-exporter:latest
    container_name: my_node_exporter
    volumes:
     - /proc:/host/proc:ro
     - /sys:/host/sys:ro
     - /:/rootfs:ro
    command:
     - '--path.procfs=/host/proc'
     - '--path.sysfs=/host/sys'
     - '--path.rootfs=/rootfs'
    ports:
     - "9100:9100"
