global:
  scrape_interval: 5s # Каждые 5 секунд Прометей будет собирать метрики

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] # Следим за самим Прометеем на его стандартном порту
  - job_name: 'node-exporter'
    static_configs:
     - targets: ['node-exporter:9100']